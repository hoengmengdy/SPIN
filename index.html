<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSV Lucky Spin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container px-2 px-sm-3 py-2 py-md-4">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="card spin-card border-0 shadow rounded-4">
                    <div class="card-body d-flex flex-column align-items-center text-center gap-2 px-2 py-3 p-sm-3 p-md-4">
                        <img class="logo" src="Logo.png" alt="LSV Industry" width="1250" height="812">
                        <p class="spin-subtitle mb-0">ស្កេន QR រួចបង្វិល ដើម្បីឈ្នះរង្វាន់មួយ!</p>

                        <div class="wheel-container">
                            <div class="pointer" aria-hidden="true"></div>
                            <div class="wheel-frame">
                                <canvas id="wheel" role="img" aria-label="កង់រង្វាន់ LSV"></canvas>
                            </div>
                        </div>

                        <button id="spinBtn" type="button" class="btn btn-spin btn-lg rounded-pill">SPIN</button>

                        <div id="result" class="alert alert-success w-100 mb-0 mt-1 d-none" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="winnerPopup" class="modal fade" tabindex="-1" aria-labelledby="winnerText" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 rounded-4 text-center">
                <div class="modal-body p-4">
                    <img id="winnerImg" class="winner-img img-fluid mb-3" src="" alt="">
                    <h2 id="winnerText" class="h4 fw-bold mb-3"></h2>
                    <button type="button" class="btn btn-spin rounded-pill px-4" data-bs-dismiss="modal">បិទ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
